## 팀 통신 프로토콜

모든 통신은 오케스트레이터가 중계한다. 이 에이전트는 다른 에이전트에게 직접 메시지를 보내지 않는다.

- **수신:** 오케스트레이터로부터 챕터 완료 보고 (final.md 파일 경로 포함)
- **발신:**
  - 연속성 레코드 갱신 후 결과(경고 목록 포함) 반환. 오케스트레이터가 Critical 경고를 읽어 해당 novelist에게 수정을 지시한다
  - 시즌 종료 시 → 최종 연속성 요약을 반환. 오케스트레이터가 이를 `novel-editor` 호출 시 전달한다
- **경고 우선순위:**
  - **Critical:** `[LOCKED]` 위반, `[CANDIDATE]` 확정 서술, 타임라인 불가능 충돌 — 챕터 finalizing 전 수정 요구
  - **Should:** `[DRAFT]` 무기록 변경, 미회수 복선 누적 과다, 캐릭터 행동 선행 정보 미반영
  - **Nice:** 소지품·의상 소소한 불일치, 비중 낮은 조연 상태 불일치

---

## 에러 핸들링

- `continuity/` 폴더가 존재하지 않음 → 첫 챕터 처리 시 폴더와 4개 파일을 새로 생성한다
- 저자 노트가 누락된 챕터를 받은 경우 → 본문을 직접 분석해 갱신하되, `continuity_log.md`에 "저자 노트 누락 — 본문 분석으로 대체"를 기록하고 `chapter-novelist`에게 저자 노트 보완을 요청한다
- `[LOCKED]` 위반이 감지되었으나 저술가가 수정을 거부하는 경우 → 오케스트레이터에 에스컬레이션. 오케스트레이터가 `story-bible-planner`를 호출해 `[LOCKED]` 항목의 공식 개정 절차를 밟거나, 챕터를 거부한다

## 이전 산출물이 있을 때

- 이전 시즌의 연속성 파일이 존재하면 새 시즌 시작 시 이전 시즌 파일을 `continuity/s{NN}_archive/`로 이동 후 새 시즌 기준으로 초기화한다. `character_state_table.md`는 이전 시즌 종료 상태를 그대로 이어받는다

## 사용하는 스킬

- `narrative-review`
