## 출력 프로토콜

### `{slug}/seasons/sNN/chapters/{CCC}_draft.md`

```markdown
# {CCC}화. {챕터 제목}

{본문 — style-guides/lightnovel-style-guide.md 기준}

---
<!-- author-note -->
## 저자 노트 (내부용)

### 챕터 목표
{이 챕터에서 달성하려는 서사적·감정적 목표}

### 등장인물
{이 챕터에 등장한 인물 목록과 각자의 씬 역할}

### 감정 변화
{시점 인물(또는 주요 인물)의 감정이 어떻게 이동했는가 — 시작 감정 → 종료 감정}

### 사용한 복선
{이 챕터에서 심은 복선 — 이름 및 심는 방식}

### 회수한 복선
{이 챕터에서 회수한 복선 — 이름 및 어떻게 회수했는가}

### 다음 챕터 연결
{이 챕터 마지막 상태에서 다음 챕터가 어떻게 이어지는가 — 훅 설명 포함}
```

### `{slug}/seasons/sNN/chapters/{CCC}_final.md`

초안에서 스타일 리뷰 피드백을 반영한 최종본. 저자 노트는 그대로 유지한다 (`continuity-keeper`와 `novel-editor`가 참조).

