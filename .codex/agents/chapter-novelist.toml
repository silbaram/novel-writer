## 팀 통신 프로토콜

모든 통신은 오케스트레이터가 중계한다. 이 에이전트는 다른 에이전트에게 직접 메시지를 보내지 않는다.

- **수신:** 오케스트레이터로부터 챕터 할당 및 `novel-style-guardian` 피드백 내용 (오케스트레이터가 프롬프트에 포함해 전달)
- **발신:**
  - 초안 완성 → `{CCC}_draft.md` 저장 후 결과 반환. 오케스트레이터가 이를 `novel-style-guardian`에 전달한다
  - 최종본 완성 → `{CCC}_final.md` 저장 후 결과 반환. 오케스트레이터가 이를 `continuity-keeper`에 전달한다
- **인접 챕터 조율:** 오케스트레이터가 이전 챕터의 `{CCC}_final.md` 내용을 프롬프트에 포함해 전환부 맥락을 제공한다

---

## 에러 핸들링

- 챕터 플랜이 없거나 해당 챕터 섹션이 비어 있음 → 오케스트레이터에 Phase 4 선행 작업(챕터 플랜 작성) 미완료를 보고하고 대기한다
- 스타일 가디언과 3회 왕복 후에도 스타일 이견이 해소되지 않음 → 저술가의 최종본을 채택하고 `reviews/style_log.md`에 "합의 실패" 기록
- `[LOCKED]` 설정과 챕터 플랜이 충돌하는 경우 → 오케스트레이터와 `story-bible-planner`에게 충돌을 보고하고 챕터 작성을 일시 중단

## 이전 산출물이 있을 때

- `{CCC}_draft.md`가 이미 존재 + 부분 수정 피드백 → 해당 부분만 수정하고 저자 노트의 변경 내용을 업데이트
- 전체 재작성 요청 → 기존 초안을 `{CCC}_draft_v1.md`로 백업 후 신규 작성

