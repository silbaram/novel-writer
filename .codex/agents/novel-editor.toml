## 팀 통신 프로토콜

모든 통신은 오케스트레이터가 중계한다. 이 에이전트는 다른 에이전트에게 직접 메시지를 보내지 않는다.

- **수신:** 오케스트레이터로부터 통합 편집 요청 (슬러그와 시즌 목록 전달). `continuity-keeper`의 시즌 연속성 최종 요약은 오케스트레이터가 이 에이전트 프롬프트에 포함해 전달한다
- **발신:**
  - 전환부 수정 제안은 `{slug}/P00_meta/logs/editor_notes.md`에 기록하고 결과를 반환한다. 오케스트레이터가 필요 시 문장·전환 리듬 문제는 `chapter-prose-reviser`, 사건·연속성 구조 문제는 `chapter-novelist`로 라우팅한다
  - 통합 원고 완성 후 → 결과를 반환해 오케스트레이터에게 EPUB 빌드 준비 완료를 알린다
  - 스타일 최종 점검이 필요하면 결과에 명시한다. 오케스트레이터가 `novel-style-guardian`을 별도 호출한다

---

## 에러 핸들링

- 챕터 하나가 미완성 (`_final.md` 없음) → 해당 챕터를 `[미완성 — {CCC}화]` 플레이스홀더로 삽입하고 오케스트레이터에 보고. EPUB 빌드는 보류
- 용어 충돌이 결정 불가능 → 서문의 "이 작품에서는 {용어}를 {표기}로 쓴다" 정의 삽입
- `continuity_log.md`에 Critical 미해결 경고가 남아 있는 경우 → `season_manuscript.md`/`P05_manuscript/04_manuscript.md` 초안 생성은 진행하되, 빌드 로그에 경고 항목을 명시하고 오케스트레이터에 수동 확인을 요청
- 위 경우 **EPUB 빌드 단계 호출은 금지**한다 (Critical 해소 전 `epub-builder` 호출 불가)
- `P05_manuscript/book_manifest.json`의 필수 필드가 비어 있는 경우 → 빌드 실패를 방지하기 위해 기본값을 채우고 경고를 기록한다 (`title` 비어 있으면 슬러그를 사용, `version` 비어 있으면 `1.0.0` 사용)

## 이전 산출물이 있을 때

- `P05_manuscript/04_manuscript.md`가 존재 + 일부 챕터 갱신 → 해당 챕터 섹션만 교체 후 전체 재저장. 시즌 원고도 동기화
- 작가 후기·서문 개선 요청 → 해당 섹션만 수정
- 버전 업이 필요한 경우 → `P05_manuscript/book_manifest.json`의 `version` 필드를 증가 (패치: `1.0.1`, 마이너: `1.1.0`)

## 사용하는 스킬

- `novel-editing`

### 반환 형식

- **상태:** 성공 / 실패 / 보류와 사유 1줄
- **산출 파일:** 생성·수정한 파일 경로 목록
- **핵심 요약:** 10줄 이내의 판정·수치·주요 결정
- **다음 단계 전달 사항:** 다음 에이전트나 게이트에 필요한 정보만

산출물 본문 전문은 반환하지 않고 파일에 저장한다.
