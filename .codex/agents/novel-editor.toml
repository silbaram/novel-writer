## 출력 프로토콜

### `{slug}/P05_manuscript/sNN/season_manuscript.md`

각 시즌의 챕터를 순서대로 통합한 시즌 단위 원고.

```markdown
# {시즌 제목}
## 시즌 {N}

{챕터 1 본문 — 저자 노트 제거}

---

{챕터 2 본문}

...
```

### `{slug}/P05_manuscript/04_manuscript.md`

EPUB 빌더가 직접 소비하는 전체 통합 원고. 기술서 하네스와 동일한 최상위 구조를 따른다.

```markdown
# {작품 제목}

## 저자
{author}

## 서문
{독자 초대장 — 이 작품이 무엇인지, 누가 읽으면 좋은지. 소설이므로 "어떤 여정이 펼쳐지는지"를 스포일러 없이 소개한다}

## 목차
{시즌별 · 챕터별 목록}

---

# 시즌 1. {시즌 제목}

{시즌 1 챕터 본문들}

---

# 시즌 2. {시즌 제목}

{시즌 2 챕터 본문들}

...

## 작가 후기
{시리즈를 마치며 또는 이 시즌을 마치며 — 인물·세계에 대한 애정을 담은 짧은 글. 필요 시 다음 이야기에 대한 작은 여운을 암시하되, 복선 추적 상세는 내부 continuity 파일에만 유지한다}
```

### `{slug}/P05_manuscript/book_manifest.json`

`build_epub.sh`가 직접 파싱하는 메타데이터 파일. 기술서 하네스의 필수 필드를 모두 포함하며, 소설 전용 선택 필드를 추가한다.

오케스트레이터가 사용자 지정 저자를 전달했다면 `"author"`를 그 값으로, 없으면 라노벨/소설 기본값 `AI-Author`를 사용한다.

```json
{
  "title": "...",
  "subtitle": "...",
  "author": "AI-Author",
  "language": "ko",
  "pub_date": "YYYY-MM-DD",
  "identifier": "urn:uuid:...",
  "description": "한 문단 소개",
  "cover_image": "P06_publication/assets/cover.png",
  "version": "1.0.0",

  "genre": "...",
  "series": {
    "name": "...",
    "volume": 1,
    "total_volumes_planned": 0
  },
  "structure": {
    "type": "light_novel",
    "season_count": 1,
    "chapter_count": 0
  }
}
```

**필수 필드 (build_epub.sh 호환):** `title`, `subtitle`, `author`, `language`, `pub_date`, `identifier`, `description`, `cover_image`, `version`

**소설 전용 선택 필드:** `genre`, `series`, `structure` — `build_epub.sh`는 알 수 없는 필드를 무시하므로 호환성에 영향 없음

### `{slug}/P00_meta/logs/proofread_log.md`

교열 후 아래 유형별 수정 건수와 대표 사례만 기록한다.

- 맞춤법·띄어쓰기
- 비문
- 문장부호
- 숫자·단위 표기
- `glossary.md` 표준 표기
- 수정하지 않고 편집 검토로 넘긴 문체·내용 이슈

