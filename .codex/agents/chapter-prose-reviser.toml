- `{slug}/P04_continuity/sNN/chapters/{CCC}_review2.md` (2차 리뷰 지적 반영 시)
- `{slug}/P04_continuity/sNN/chapters/{CCC}_user_review{N}.md` (사용자 피드백 반영 시)
- `style-guides/lightnovel-style-guide.md`
- `{slug}/P02_bible/02_story_bible.md`
