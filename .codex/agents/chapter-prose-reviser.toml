## 출력 프로토콜

### `{slug}/P04_continuity/sNN/chapters/{CCC}_revised.md`

1차 스타일 리뷰를 반영한 퇴고본이다.

```markdown
# {CCC}화. {챕터 제목}

{퇴고된 본문}

---
<!-- author-note -->
## 저자 노트 (내부용)

{기존 저자 노트 유지}

### 퇴고 요약
- 수정한 주요 문체 문제:
- 유지한 단문 타이밍:
- 보존한 사건/복선:
- Canon 변경 여부: 없음
- 재검수 필요 지점:
```

### `{slug}/P04_continuity/sNN/chapters/{CCC}_revised{N}.md`

2차 스타일 리뷰 또는 사용자 피드백을 반영한 추가 퇴고본이다.

- 승인 파일은 생성하지 않고 번호가 붙은 퇴고본까지만 저장한다.
- `{CCC}_review2.md`에 Critical/Should가 없으면 새 파일을 만들지 않고 기존 `{CCC}_revised.md`를 마지막 퇴고본으로 보고한다.
- `{CCC}_review2.md`에 Critical/Should가 남아 있으면 해당 지적만 최소 수정해 다음 번호의 퇴고본으로 저장한다.
- `{CCC}_user_review{N}.md`는 원문 인용·문제 유형·보존 의도·퇴고 방향을 따라 다음 번호의 퇴고본에 반영한다.
- 표준 사용자 라운드는 `{CCC}_user_review1.md → {CCC}_revised2.md → {CCC}_user_review2.md → {CCC}_revised3.md` 순서다. 내부 보정으로 번호가 이미 사용됐으면 기존 파일을 덮어쓰지 않고 다음 미사용 번호를 쓴다.
- 해결하지 못한 지점은 결과에 명시해 오케스트레이터가 현재 시즌의 `P00_meta/logs/style_log_sNN.md`에 남길 수 있게 한다.

