## 각 시즌 바이블 필수 항목

시즌 1(완전 상세)을 기준으로 모든 필드를 설명한다. 시즌 2 이상의 방향/씨앗 수준에서는 해당 표기가 있는 필드만 포함한다.

### 시즌 제목 `[모든 수준]`

작업용 제목이다. 정식 출판 제목이 아니어도 된다. 이 시즌이 무엇에 관한 시즌인지 한 단어~짧은 구절로 표현한다.

예: "각성", "배신의 대가", "왕좌의 균열"

### 시즌 역할 `[모든 수준]`

전체 시리즈에서 이 시즌이 맡는 서사적 기능을 한 문장으로 정의한다.

예:
- 시즌 1: "주인공이 세계의 규칙을 처음 마주하고 첫 시련을 통과하는 시즌"
- 시즌 2: "1시즌에서 쌓인 신뢰가 균열나고 내부 적이 드러나는 시즌"

### 시즌 핵심 질문 `[모든 수준]`

"이 시즌이 끝났을 때 독자가 답을 얻어야 하는 질문"을 한 문장으로 정의한다. 질문에 답하지 못한 채 시즌이 끝나면 독자는 배신감을 느낀다.

예: "주인공은 힘을 얻기 위해 동료를 희생할 수 있는가?"

### 시작 상태 `[시즌 1·2 수준 이상]`

이 시즌이 시작될 때 주인공과 세계의 상태. 전 시즌이 있다면 피날레 직후의 상태를 기준으로 한다.

- 주인공 상태: 감정·관계·능력·정보 기준
- 세계 상태: 세력 균형·위기 정도 기준

### 종료 상태 `[시즌 1·2 수준 이상]`

이 시즌 피날레 직후의 상태. 시작 상태와 비교해 무엇이 달라졌는지를 명시한다.

### 주요 갈등 `[시즌 1 완전 상세]`

시즌 내에서 전개될 갈등을 외부·내부·대인·사회 층위로 각각 한 문장씩 기술한다. 스토리 바이블의 갈등 카드를 이 시즌에 맞게 구체화한다.

| 층위 | 이번 시즌에서의 형태 |
|------|-------------------|
| 외부 갈등 | |
| 내부 갈등 | |
| 대인 갈등 | |
| 사회적 갈등 | |

### 주요 캐릭터 아크 `[시즌 1 완전 상세]`

주요 인물이 이번 시즌 동안 어떻게 변화하는지를 기술한다. 최소 주인공과 히로인·라이벌·빌런(해당하는 경우)을 포함한다.

형식: `{인물명}: {시작 상태} → {종료 상태} — {변화의 원인이 된 사건}`

### 주요 사건 `[시즌 1 완전 상세]`

이번 시즌에서 반드시 일어나야 하는 사건 3~7개. 챕터 배치는 Phase 4에서 결정하므로 순서가 아닌 **반드시 발생해야 하는 사건의 목록**으로 기술한다.

각 사건 항목: `사건명 — 서사 기능 (무엇을 바꾸는가)`

### 이번 시즌에서 심을 복선 `[시즌 1 완전 상세]`

이번 시즌 중 독자에게 슬쩍 보여주되 아직 설명하지 않을 장치들. 이후 시즌에서 회수된다.

형식: `복선 이름 — 어떻게 심는가 — 언제 회수할 예정인가 (시즌 N)`

### 이번 시즌에서 회수할 복선 `[시즌 1 완전 상세]`

전 시즌(또는 스토리 바이블)에서 설정된 복선 중 이번 시즌에서 독자에게 돌려줄 것들.

형식: `복선 이름 — 원래 심겼던 위치 — 이번 시즌 어떻게 회수하는가`

시즌 1에는 이전 시즌이 없으므로, 스토리 바이블이나 시즌 초반에 심은 복선을 시즌 후반에 회수하는 것으로 처리한다.

### 다음 시즌으로 넘길 복선 `[모든 수준]`

이번 시즌에서 심었지만 회수하지 않고 다음 시즌으로 가져가는 장치들. 피날레 이후에도 독자가 계속 궁금해할 내용이다.

형식: `복선 이름 — 이번 시즌에서의 형태 — 다음 시즌 어떻게 전개될 예정인가`

### 시즌 피날레 `[시즌 1·2 수준 이상]`

피날레가 이행해야 할 **핵심 약속**을 두 가지로 명시한다.

1. **이번 시즌의 핵심 질문에 대한 답:** 모호하게 끝내지 않는다. 질문에 명확히 답하거나 주인공이 그 질문에 직면하게 만든다.
2. **피날레에서 해소되는 것:** 독자에게 만족을 주는 요소. 갈등의 한 층위가 해소되거나, 중요한 관계가 변화하거나, 주인공이 결정적 선택을 한다.

피날레가 다음 시즌 예고편만으로 끝나면 독자는 배신감을 느낀다. 이번 시즌의 약속을 먼저 이행한 뒤 훅을 남겨야 한다.

### 다음 시즌 후킹 `[모든 수준]`

피날레 직후 또는 마지막 장면에서 독자에게 심는 다음 시즌의 씨앗. 한 문장으로 정의한다.

형식: "독자가 남기고 싶은 질문 — 어떤 형태로 심는가"

예: "빌런이 사실 주인공의 과거와 연결되어 있음을 암시하는 대사 — 마지막 씬에서 빌런의 독백으로"

