## 시즌 간 연속성 관리

`P03_planning/03_season_plan.md`에 다음 테이블을 포함한다.

### 복선 흐름 추적표

| 복선 이름 | 심은 시즌 | 회수 예정 시즌 | 상태 |
|----------|----------|--------------|------|
| | | | 미회수 / 회수 완료 / 이월 |

### 캐릭터 아크 연속성

주요 인물별로 시즌 1 → 시즌 N까지의 상태 변화를 한 줄씩 기술한다. 이후 `narrative-guardian`이 이 테이블을 참조해 챕터 저술 중 연속성을 점검한다.

| 인물 | 시즌 1 종료 상태 | 시즌 2 시작 상태 | 시즌 2 종료 상태 | ... |
|------|----------------|----------------|----------------|-----|

### 미해결 질문 이월 목록

시즌이 끝났는데도 독자에게 답하지 않은 질문을 추적한다. 의도적 유보인지 누락인지 구분한다.

| 질문 | 심어진 시즌 | 답해질 예정 시즌 | 의도적 유보 여부 |
|------|-----------|----------------|----------------|

