| 시즌 2 | **방향 수준** — 역할·핵심 질문·시작/종료 상태·후킹만 | 명시적 요청 시 완전 상세 |
| 시즌 3 이상 | **씨앗 수준** — 핵심 질문 + 후킹 한 문장씩 | 명시적 요청 시 완전 상세 |

