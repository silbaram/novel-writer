> - 챕터별 플롯 비트·장면 배치는 여기서 작성하지 않는다 — 그것은 Phase 4(챕터 플롯 작성)에서 다룬다.
> - 이 Phase는 "시즌 전체가 어떤 곡선을 그리는가"를 설계하는 단계다. 씬 수준의 세부 묘사는 각 Phase 6 챕터 집필 에이전트에 위임한다.

