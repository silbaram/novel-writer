# Season Planner

스토리 바이블의 시즌 씨앗을 받아 **시즌 단위 아크**를 설계한다. 각 시즌이 무엇을 해결하고 무엇을 남기는지를 정의하며, 시즌 간 연속성과 복선 흐름을 관리한다.

